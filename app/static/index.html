<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онтологический анализ процессов</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/table-viewer.css">
    <link rel="stylesheet" href="/static/css/xml-viewer.css">
    <link rel="stylesheet" href="/static/css/graph.css">
    <link rel="stylesheet" href="/static/css/stages.css">
    <link rel="stylesheet" href="/static/css/entities.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <link rel="stylesheet" href="/static/css/chat-panel.css">

    <style>
        * { box-sizing: border-box; }

        #messages {
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            padding: 12px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .msg { margin: 6px 0; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .user { background: #dcf8c6; margin-left: auto; text-align: right; }
        .bot  { background: #eaeaea; }
        .file-link { color: #1a5fb4; text-decoration: underline; }

        #form { display: flex; gap: 8px; align-items: center; }
        #input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }

        /* Стилизованная кнопка прикрепления файла */
        .attach-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #eef2f7;
            border: 1px solid #ccc;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }
        .attach-btn:hover { background: #dde7f2; }
        .attach-btn.disabled { opacity: 0.5; pointer-events: none; }
        #fileInput { display: none; }

        button { padding: 10px 16px; border: none; border-radius: 8px; background: #4a90e2; color: white; cursor: pointer; }
        button:disabled { background: #aaa; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Кнопка скрытия левой панели-->
        <button class="hide-sidebar-btn" id="hide-leftbar-btn">
            <span>◀</span>
        </button>
        <!-- Левая колонка: список процессов в стиле чатов -->
        <div id="process-list" class="process-list">
           <div class="process-list-header">
               <span id="processCount">📋 Процессы (3)</span>
               <button class="add-process-btn" id="addProcessBtn" title="Добавить новый процесс">+</button>
           </div>
           <div class="process-items" id="processItems">
               <!-- Процессы будут динамически добавляться сюда -->
           </div>
           <!-- Индикатор состояния соединения -->
            <div class="connection-status process-footer" id="connectionStatus">
                <div class="status-indicator" id="statusIndicator"></div>
                <span class="status-text" id="loginText">8213531</span>
            </div>
        </div>
        <!-- Центральная колонка: кнопки + контент -->
        <div class="main-panel">
            <!-- Кнопки основного меню-->
            <div class="button-bar">
                <button class="tab-btn" id="btn1">Структура</button>
                <button class="tab-btn" id="btn2">Анализ</button>
                <button class="tab-btn" id="btn3">Онтология</button>
                <button class="tab-btn" id="btn4">Предиктивная модель</button>
            </div>
            <!-- Кнопки под-меню -->
            <div class="button-bar" id="sub-btn-bar">
            </div>

            <!-- Динамический контент -->
            <div class="content-area" id="contentArea">
            </div>
        </div>
        <!-- Правая колонка: чат с ИИ -->
        <div class="chat-panel" id="chatPanel">
            <h1 class="chat-title">💬 Чат с AI-ботом</h1>

            <div id="messages"></div>

            <form id="form">
                <label for="fileInput" class="attach-btn" id="attachBtn" title="Прикрепить PDF">📎</label>
                <input id="fileInput" type="file" accept="application/pdf,.pdf" />
                <input id="input" type="text" placeholder="Напиши сообщение..." autocomplete="off" />
                <button type="submit" id="send">Отправить</button>
            </form>
        </div>
        <button class="hide-sidebar-btn" id="hide-rightbar-btn">
            <span>▶</span>
        </button>
        <script src="/static/js/script.js"></script>
        <!-- Шаблоны html -->
    <script src="/static/js/html/pdf-viewer.html.js"></script>
    <script src="/static/js/html/table-viewer.html.js"></script>
    <script src="/static/js/html/xml-viewer.html.js"></script>
    <script src="/static/js/html/simulation.html.js"></script>
    <script src="/static/js/html/stats.html.js"></script>
    <script src="/static/js/html/graph.html.js"></script>
    <script src="/static/js/html/entities.html.js"></script>
    <script src="/static/js/html/stages.html.js"></script>
    <script src="/static/js/html/params.html.js"></script>
    <!-- Скрипты вкладки "Онтология" -->
    <script src="/static/js/model/table-viewer.js"></script>
    <script src="/static/js/model/model.js"></script>
    <!-- Скрипты вкладки "Онтология" -->
    <script src="/static/js/ontology/xml-viewer.js"></script>
    <script src="/static/js/ontology/ontology.js"></script>
    <!-- Скрипты вкладки "Анализ" -->
    <script src="/static/js/analyze/graph.js"></script>
    <script src="/static/js/analyze/analyze.js"></script>
    <!-- Скрипты вкладки "Структура" -->
    <script src="/static/js/structure/stages.js"></script>
    <script src="/static/js/structure/entities.js"></script>
    <script src="/static/js/structure/structure.js"></script>
    <!-- Вспомогательные скрипты: api вызовы, чат с ИИ, проверка соединения -->
    <script src="/static/js/checker.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/api.js"></script>
    <!-- Главный скрипт запуска приложения -->
    <script src="/static/js/main.js"></script>
</body>
</html>
